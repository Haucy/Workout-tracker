<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap');
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#080808;--s1:#0f0f0f;--s2:#161616;--s3:#1e1e1e;--s4:#262626;--s5:#2e2e2e;
  --t1:#ffffff;--t2:rgba(255,255,255,.55);--t3:rgba(255,255,255,.22);--t4:rgba(255,255,255,.08);
  --border:rgba(255,255,255,.07);--border2:rgba(255,255,255,.12);
  --green:#22d3a0;--green-d:rgba(34,211,160,.1);--green-b:rgba(34,211,160,.25);
  --blue:#60a5fa;--blue-d:rgba(96,165,250,.1);--blue-b:rgba(96,165,250,.25);
  --red:#f87171;--red-d:rgba(248,113,113,.1);--red-b:rgba(248,113,113,.25);
  --amber:#fbbf24;--amber-d:rgba(251,191,36,.1);
  --r:14px;--r-sm:10px;--r-xs:7px;
  --spring:cubic-bezier(.34,1.56,.64,1);
  --ease:cubic-bezier(.4,0,.2,1);
  --font:'Inter',system-ui,sans-serif;
}
html,body{height:100%;overflow:hidden;font-family:var(--font);background:var(--bg);color:var(--t1);font-size:15px;-webkit-font-smoothing:antialiased}
#root{display:flex;flex-direction:column;height:100%;position:relative}

/* ─── AUTH SCREENS ─── */
.auth-screen{position:fixed;inset:0;background:var(--bg);z-index:1000;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px 28px;overflow-y:auto}
.auth-screen.hidden{display:none}
.auth-inner{width:100%;max-width:360px;text-align:center}
.auth-logo{width:72px;height:72px;background:linear-gradient(135deg,#22d3a0,#60a5fa);border-radius:22px;display:flex;align-items:center;justify-content:center;margin:0 auto 24px;font-size:36px;box-shadow:0 8px 32px rgba(34,211,160,.25)}
.auth-brand h1{font-size:32px;font-weight:900;letter-spacing:-.8px;margin-bottom:10px;background:linear-gradient(135deg,#fff,#aaa);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.auth-brand p{font-size:15px;color:var(--t2);line-height:1.5;margin-bottom:48px}
.google-btn{width:100%;padding:16px 24px;border:none;border-radius:14px;background:#fff;color:#1a1a1a;font-size:15px;font-weight:700;font-family:var(--font);cursor:pointer;display:flex;align-items:center;justify-content:center;gap:12px;transition:all .2s var(--ease);box-shadow:0 2px 12px rgba(0,0,0,.3)}
.google-btn:hover{transform:translateY(-2px);box-shadow:0 6px 20px rgba(0,0,0,.4)}
.google-btn:active{transform:scale(.98)}
.google-btn:disabled{opacity:.6;cursor:not-allowed}
.google-btn svg{width:20px;height:20px}
.auth-card{max-width:420px;margin:0 auto;padding:8px 4px;text-align:center}
.auth-title{font-size:28px;font-weight:900;letter-spacing:-.6px;margin:0 0 8px;background:linear-gradient(135deg,#fff,#aaa);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.auth-sub{font-size:14px;color:var(--t2);line-height:1.5;margin:0 0 24px}
.auth-input{width:100%;padding:14px 16px;border:1px solid var(--b1);border-radius:12px;background:var(--bg-2);color:var(--t1);font-size:15px;font-family:var(--font);margin-bottom:12px;transition:border-color .2s,box-shadow .2s;box-sizing:border-box}
.auth-input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(34,211,160,.15)}
.auth-input::placeholder{color:var(--t3)}
.auth-btn{width:100%;padding:14px 24px;border:none;border-radius:12px;background:linear-gradient(135deg,#22d3a0,#60a5fa);color:#0a0e1a;font-size:15px;font-weight:800;font-family:var(--font);cursor:pointer;transition:all .2s var(--ease);box-shadow:0 4px 16px rgba(34,211,160,.25)}
.auth-btn:hover:not(:disabled){transform:translateY(-1px);box-shadow:0 6px 22px rgba(34,211,160,.35)}
.auth-btn:active:not(:disabled){transform:scale(.98)}
.auth-btn:disabled{opacity:.6;cursor:not-allowed}
.auth-info{font-size:13px;color:var(--accent);margin-top:16px;line-height:1.5}
.auth-err{background:var(--red-d);border:1px solid var(--red-b);border-radius:var(--r-sm);padding:14px 16px;font-size:13px;color:var(--red);line-height:1.5;text-align:left;margin-top:16px}
.auth-footer{text-align:center;margin-top:32px;font-size:12px;color:var(--t3);line-height:1.6}
.auth-tabs{display:flex;gap:4px;margin-bottom:16px;background:var(--s1);border:1px solid var(--border);border-radius:10px;padding:3px}
.auth-tab{flex:1;padding:9px 6px;border:none;border-radius:8px;background:transparent;color:var(--t3);font-size:12px;font-weight:700;font-family:var(--font);cursor:pointer;transition:all .18s var(--ease)}
.auth-tab.on{background:var(--s3);color:var(--t1)}

/* ─── TOPBAR ─── */
.topbar{padding:14px 18px 10px;background:var(--bg);border-bottom:1px solid var(--border);flex-shrink:0;display:flex;align-items:center;gap:12px;position:relative;z-index:10}
.tb-left{flex:1;min-width:0}
.tb-eyebrow{font-size:10px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--t3);margin-bottom:3px}
.tb-sub{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tb-user{display:flex;align-items:center;gap:8px}
.tb-avatar{width:30px;height:30px;border-radius:50%;background:var(--s4);border:1px solid var(--border2);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;color:var(--t2);cursor:pointer;flex-shrink:0;letter-spacing:.02em}
.tb-ring{position:relative;width:36px;height:36px;flex-shrink:0;cursor:pointer}
.tb-ring svg{width:36px;height:36px;transform:rotate(-90deg)}
.ring-bg{fill:none;stroke:var(--s4);stroke-width:3}
.ring-fill{fill:none;stroke:var(--green);stroke-width:3;stroke-linecap:round;stroke-dasharray:94.2;stroke-dashoffset:94.2;transition:stroke-dashoffset .7s var(--ease)}
.ring-pct{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:800;color:var(--t2)}

/* ─── USER MENU ─── */
.user-menu{position:fixed;top:0;right:0;bottom:0;left:0;z-index:500;display:none}
.user-menu.open{display:block}
.user-menu-backdrop{position:absolute;inset:0;background:rgba(0,0,0,.6);backdrop-filter:blur(4px)}
.user-menu-panel{position:absolute;top:62px;right:14px;background:var(--s2);border:1px solid var(--border2);border-radius:var(--r);width:220px;overflow:hidden;transform-origin:top right}
.user-menu-header{padding:14px 16px;border-bottom:1px solid var(--border)}
.user-menu-email{font-size:12px;font-weight:600;color:var(--t2);word-break:break-all}
.user-menu-name{font-size:14px;font-weight:700;margin-bottom:2px}
.user-menu-item{display:flex;align-items:center;gap:10px;padding:13px 16px;cursor:pointer;font-size:13px;font-weight:600;color:var(--t2);border:none;background:transparent;width:100%;font-family:var(--font);text-align:left;transition:all .15s}
.user-menu-item:active{background:var(--s3);color:var(--t1)}
.user-menu-item svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
.user-menu-item.danger{color:var(--red)}
.user-menu-item.danger:active{background:var(--red-d)}
.user-menu-sep{height:1px;background:var(--border);margin:0}

/* ─── TABBAR ─── */
.tabbar{display:flex;background:var(--s1);border-top:1px solid var(--border);flex-shrink:0;padding-bottom:env(safe-area-inset-bottom);position:relative}
.tab-track{position:absolute;top:0;left:0;height:2px;background:var(--t1);border-radius:0 0 2px 2px;transition:left .3s var(--spring),width .3s var(--spring)}
.tab-btn{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:10px 4px 8px;cursor:pointer;border:none;background:transparent;gap:4px;font-family:var(--font);color:var(--t3);font-size:9px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;transition:color .22s var(--ease);-webkit-user-select:none;user-select:none}
.tab-btn.on{color:var(--t1)}
.tab-btn svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;transition:transform .22s var(--spring)}
.tab-btn:active svg{transform:scale(.82)}

/* ─── CONTENT ─── */
.content{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;background:var(--bg)}
.content::-webkit-scrollbar{display:none}
.screen{display:none;min-height:100%;padding:16px 16px 32px}
.screen.active{display:block}

/* ─── CARDS ─── */
.card{background:var(--s1);border:1px solid var(--border);border-radius:var(--r);margin-bottom:9px;overflow:hidden}
.card-row{display:flex;align-items:center;padding:14px 16px;gap:10px;cursor:pointer;-webkit-user-select:none;user-select:none}
.card-name{flex:1;font-size:14px;font-weight:600;letter-spacing:-.15px}
.chip{font-size:9px;font-weight:800;letter-spacing:.08em;padding:3px 8px;border-radius:20px;text-transform:uppercase;flex-shrink:0}
.chip.bw{background:var(--green-d);color:var(--green);border:1px solid var(--green-b)}
.chip.gym{background:var(--blue-d);color:var(--blue);border:1px solid var(--blue-b)}
.muscle-tag{font-size:10px;color:var(--t3);background:var(--s3);padding:3px 8px;border-radius:20px;flex-shrink:0}
.chevron{width:16px;height:16px;flex-shrink:0;color:var(--t3);transition:transform .3s var(--spring)}
.chevron svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round}
.chevron.open{transform:rotate(90deg)}
.icon-row{display:flex;gap:2px}
.icon-btn{width:32px;height:32px;border:none;background:transparent;cursor:pointer;border-radius:var(--r-xs);display:flex;align-items:center;justify-content:center;color:var(--t3);transition:all .15s}
.icon-btn svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.icon-btn:active{background:rgba(255,255,255,.04);color:var(--t1)}
.icon-btn.del:active{color:var(--red);background:var(--red-d)}

/* ─── SETS ─── */
.sets-body{border-top:1px solid var(--border);padding:12px 16px 14px}
.sets-head{display:flex;font-size:9px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--t3);padding-bottom:8px}
.set-row{display:flex;align-items:center;gap:8px;padding:4px 0}
.set-num{width:18px;font-size:11px;color:var(--t3);text-align:center;flex-shrink:0}
.n-inp{flex:1;padding:9px 6px;border:1px solid var(--border2);border-radius:var(--r-xs);font-size:14px;text-align:center;background:var(--s2);color:var(--t1);font-family:var(--font);min-width:0;outline:none;transition:border-color .15s}
.n-inp:focus{border-color:rgba(255,255,255,.28)}
.sep{font-size:11px;color:var(--t3);flex-shrink:0}
.bw-ph{flex:1;text-align:center;font-size:10px;color:var(--t3);font-weight:600}
.del-set{width:26px;height:26px;border:none;background:transparent;cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--t3);border-radius:var(--r-xs);flex-shrink:0}
.del-set svg{width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round}
.del-set:active{color:var(--red);background:var(--red-d)}
.add-set-row{display:flex;align-items:center;padding-top:10px;border-top:1px solid var(--border);margin-top:6px;gap:8px}
.add-set-btn{display:flex;align-items:center;gap:5px;font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--t3);border:none;background:transparent;cursor:pointer;font-family:var(--font)}
.add-set-btn svg{width:12px;height:12px;stroke:currentColor;fill:none;stroke-width:2.5;stroke-linecap:round}
.rest-config{display:flex;align-items:center;gap:5px;margin-left:auto}
.rest-lbl{font-size:10px;color:var(--t3);font-weight:600;text-transform:uppercase;letter-spacing:.06em}
.rest-inp{width:40px;text-align:center;padding:4px;border:1px solid var(--border);border-radius:var(--r-xs);background:var(--s2);color:var(--t1);font-size:12px;font-family:var(--font);outline:none}
.rest-presets{display:flex;gap:3px}
.rp{padding:3px 7px;border-radius:20px;border:1px solid var(--border);background:transparent;color:var(--t3);font-size:9px;font-weight:700;cursor:pointer;font-family:var(--font);transition:all .15s}
.rp.on{border-color:var(--border2);color:var(--t1)}

/* ─── BUTTONS ─── */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:13px 20px;border-radius:var(--r-sm);font-size:14px;font-weight:700;cursor:pointer;border:1px solid var(--border2);background:var(--s2);color:var(--t1);font-family:var(--font);letter-spacing:-.1px;transition:all .15s;-webkit-user-select:none;user-select:none}
.btn svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
.btn:active{transform:scale(.96);opacity:.8}
.btn.solid{background:var(--t1);color:var(--bg);border-color:var(--t1)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--t3)}
.btn.danger{color:var(--red);border-color:var(--red-b);background:var(--red-d)}
.btn.block{width:100%;margin-bottom:8px}
.btn.sm{padding:9px 14px;font-size:13px}

/* ─── FILTER ─── */
.filter-row{display:flex;gap:5px;margin-bottom:16px;background:var(--s1);border:1px solid var(--border);border-radius:var(--r-sm);padding:3px}
.fpill{flex:1;padding:8px;border-radius:var(--r-xs);font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;border:none;background:transparent;color:var(--t3);font-family:var(--font);cursor:pointer;transition:all .2s}
.fpill.on{background:var(--s4);color:var(--t1)}

/* ─── FORM ─── */
.form-box{background:var(--s1);border:1px solid var(--border2);border-radius:var(--r);padding:16px;margin-bottom:12px}
.form-ttl{font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--t3);margin-bottom:14px}
.inp{display:block;width:100%;padding:12px 14px;border:1px solid var(--border2);border-radius:var(--r-sm);font-size:14px;background:var(--s2);color:var(--t1);font-family:var(--font);margin-bottom:10px;-webkit-appearance:none;outline:none;transition:border-color .15s}
.inp:focus{border-color:rgba(255,255,255,.25)}
.inp-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
.edit-box{background:var(--s2);padding:14px;border-top:1px solid var(--border)}
.edit-box .inp{background:var(--s3);margin-bottom:8px}

/* ─── TODAY PHASE 1 ─── */
.hero{padding:28px 4px 20px;text-align:center}
.hero-eyebrow{font-size:10px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--t3);margin-bottom:10px}
.hero-title{font-size:30px;font-weight:900;letter-spacing:-.7px;line-height:1;margin-bottom:8px}
.hero-sub{font-size:13px;color:var(--t2)}
.mg-label{font-size:10px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--t3);margin-bottom:8px;padding-left:2px}
.muscle-group{margin-bottom:14px}
.ex-pill-list{display:flex;flex-direction:column;gap:5px}
.ex-pill{display:flex;align-items:center;gap:12px;padding:13px 14px;background:var(--s1);border:1.5px solid var(--border);border-radius:var(--r);cursor:pointer;-webkit-user-select:none;user-select:none;transition:border-color .2s,background .2s;position:relative;overflow:hidden}
.ex-pill.picked{border-color:rgba(255,255,255,.25);background:rgba(255,255,255,.025)}
.pill-check{width:20px;height:20px;border-radius:5px;border:1.5px solid var(--border2);display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all .2s var(--spring);background:var(--s3)}
.ex-pill.picked .pill-check{background:var(--t1);border-color:var(--t1)}
.pill-check svg{width:11px;height:11px;stroke:var(--bg);fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;opacity:0;transform:scale(.4);transition:all .2s var(--spring)}
.ex-pill.picked .pill-check svg{opacity:1;transform:scale(1)}
.pill-info{flex:1;min-width:0}
.pill-name{font-size:14px;font-weight:600;color:var(--t2);transition:color .2s}
.ex-pill.picked .pill-name{color:var(--t1)}
.pill-sub{font-size:11px;color:var(--t3);margin-top:2px}
.start-wrap{position:sticky;bottom:0;padding:14px 0 2px;background:linear-gradient(transparent,var(--bg) 32%)}
.start-btn{width:100%;padding:18px;border-radius:var(--r);border:none;background:var(--t1);color:var(--bg);font-size:15px;font-weight:800;font-family:var(--font);letter-spacing:-.15px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:10px;-webkit-user-select:none;user-select:none}
.start-btn svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
.sel-badge{background:rgba(0,0,0,.18);border-radius:20px;padding:2px 10px;font-size:12px;font-weight:700}

/* ─── TODAY PHASE 2 ─── */
.session-arc-wrap{position:relative;width:130px;height:130px;margin:0 auto 18px}
.arc-svg{width:130px;height:130px;transform:rotate(-90deg)}
.arc-bg{fill:none;stroke:var(--s3);stroke-width:9;stroke-linecap:round}
.arc-fill{fill:none;stroke:var(--t1);stroke-width:9;stroke-linecap:round;stroke-dasharray:326.7;stroke-dashoffset:326.7;transition:stroke-dashoffset .8s var(--ease)}
.arc-fill.done{stroke:var(--green)}
.arc-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.arc-pct{font-size:28px;font-weight:900;letter-spacing:-1px;line-height:1}
.arc-lbl{font-size:9px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--t3);margin-top:2px}
.session-stats{display:flex;gap:6px;margin-bottom:4px}
.ss-card{flex:1;background:var(--s1);border:1px solid var(--border);border-radius:var(--r-sm);padding:10px 8px;text-align:center}
.ss-val{font-size:19px;font-weight:800;letter-spacing:-.4px}
.ss-lbl{font-size:9px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--t3);margin-top:2px}
.section-div{display:flex;align-items:center;gap:10px;margin:14px 0 12px}
.section-div span{font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--t3);white-space:nowrap}
.section-div::before,.section-div::after{content:'';flex:1;height:1px;background:var(--border)}
.ex-wcard{background:var(--s1);border:1px solid var(--border);border-radius:var(--r);margin-bottom:9px;overflow:hidden;transition:opacity .4s,border-color .3s}
.ex-wcard.done{opacity:.35;border-color:rgba(255,255,255,.04)}
.wcard-head{display:flex;align-items:center;gap:10px;padding:13px 16px 9px}
.wcard-name{flex:1;font-size:14px;font-weight:700;letter-spacing:-.15px;transition:color .3s}
.wcard-name.struck{text-decoration:line-through;color:var(--t3)}
.wcard-prog{font-size:11px;font-weight:700;color:var(--t3)}
.set-cklist{padding:0 16px}
.set-ck-row{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--border);cursor:pointer;-webkit-user-select:none;user-select:none;position:relative;overflow:hidden}
.set-ck-row:last-child{border-bottom:none}

</style>
</head>
<body>
<div id="root">
  <!-- ── AUTH ── -->
  <div class="auth-screen" id="auth-screen">
    <div class="auth-inner">
      <div class="auth-logo">🏋️</div>

<script>
// ─── GSAP setup ───
const spring = CustomEase.create('spring','M0,0 C0.14,0 0.27,0.37 0.37,0.56 0.5,0.8 0.65,1.04 0.76,1.04 0.89,1.04 1,1 1,1');
const $ = id => document.getElementById(id);

// ─── SUPABASE ───
const SUPABASE_URL = window.SB_URL;
const SUPABASE_ANON_KEY = window.SB_ANON_KEY;
let SB_SESSION = null;

async function sbReq(path, opts={}, useAuth=false){
  const headers = {
    apikey: SUPABASE_ANON_KEY,
    'Content-Type': 'application/json',
    ...opts.headers||{}
  };
  if(useAuth && SB_SESSION?.access_token){
    headers['Authorization'] = 'Bearer ' + SB_SESSION.access_token;
  } else {
    headers['Authorization'] = 'Bearer ' + SUPABASE_ANON_KEY;
  }
  const res = await fetch(SUPABASE_URL+path, {...opts, headers}).catch(e=>{
    throw new Error('Network: '+e.message);
  });
  const body = await res.json().catch(()=>null);
  if(!res.ok) {
    console.error('[sbReq] FAILED', {url: SUPABASE_URL+path, status: res.status, body, sentHeaders: headers});
    throw new Error('HTTP '+res.status+': '+((body&&(body.message||body.hint||body.error||body.error_description))||res.statusText));
  }
  return body;
}

// Fetch user info from Supabase using access_token (not stored in OAuth hash)
async function sbFetchUser(){
  if(SB_SESSION?.user) return SB_SESSION.user;
  try{
    const u = await sbReq('/auth/v1/user', { method:'GET' }, true);
    if(SB_SESSION) SB_SESSION.user = u;
    return u;
  }catch(e){ return null; }
}

// ─── AUTH (Magic link + Email/password via Supabase) ───
function showAuth(err){
  const authEl = $('auth-screen');
  if(authEl) authEl.classList.remove('hidden');
  $('app-shell').style.display='none';
  const formEl = $('auth-form-wrap');
  if(!formEl) return;
  formEl.innerHTML = `
    <div class="auth-card">
      <h2 class="auth-title">Workout Tracker</h2>
      <p class="auth-sub">Sign in to sync your data across devices.</p>
      <div class="auth-tabs">
        <button class="auth-tab on" data-tab="signin" type="button">Sign in</button>
        <button class="auth-tab" data-tab="signup" type="button">Sign up</button>
        <button class="auth-tab" data-tab="magic" type="button">Magic link</button>
      </div>

      <!-- Sign in -->
      <form id="signin-form" class="auth-pane" onsubmit="doSignIn(event)">
        <input type="email" id="signin-email" class="auth-input" placeholder="Email" required autocomplete="email" />
        <input type="password" id="signin-password" class="auth-input" placeholder="Password (min 6)" required autocomplete="current-password" minlength="6" />
        <button type="submit" class="auth-btn" id="signin-btn">Sign in</button>
      </form>

      <!-- Sign up -->
      <form id="signup-form" class="auth-pane" style="display:none" onsubmit="doSignUp(event)">
        <input type="email" id="signup-email" class="auth-input" placeholder="Email" required autocomplete="email" />
        <input type="password" id="signup-password" class="auth-input" placeholder="Password (min 6)" required autocomplete="new-password" minlength="6" />
        <button type="submit" class="auth-btn" id="signup-btn">Create account</button>
      </form>

      <!-- Magic link -->
      <form id="magic-form" class="auth-pane" style="display:none" onsubmit="doMagicLink(event)">
        <input type="email" id="magic-email" class="auth-input" placeholder="you@example.com" required autocomplete="email" />
        <button type="submit" class="auth-btn" id="magic-btn">Send magic link</button>
      </form>

      <div id="magic-msg" class="auth-info"></div>
      ${err?`<div class="auth-err">${err}</div>`:''}
    </div>`;

  // Tab switching
  formEl.querySelectorAll('.auth-tab').forEach(tab => {
    tab.addEventListener('click', () => {
      formEl.querySelectorAll('.auth-tab').forEach(t => t.classList.remove('on'));
      formEl.querySelectorAll('.auth-pane').forEach(p => p.style.display = 'none');
      tab.classList.add('on');
      const target = tab.dataset.tab;
      const pane = $(target + '-form');
      if(pane) pane.style.display = '';
      const msg = $('magic-msg');
      if(msg){ msg.textContent = ''; msg.className = 'auth-info'; }
    });
  });
}

async function doSignIn(e){
  e.preventDefault();
  const email = ($('signin-email').value||'').trim();
  const password = $('signin-password').value||'';
  if(!email || !password) return;
  const btn = $('signin-btn');
  if(btn){ btn.disabled = true; btn.textContent = 'Signing in...'; }
  const msg = $('magic-msg');
  try{
    const res = await sbReq('/auth/v1/token?grant_type=password', {
      method: 'POST',
      body: JSON.stringify({ email, password })
    });
    SB_SESSION = {...res, expires_at: Math.floor(Date.now()/1000) + (res.expires_in||3600)};
    saveSession(SB_SESSION);
    await bootApp();
  }catch(err){
    if(msg){ msg.textContent = friendlyAuthErr(err); msg.className = 'auth-err'; }
  }finally{
    const btn2 = $('signin-btn');
    if(btn2){ btn2.disabled = false; btn2.textContent = 'Sign in'; }
  }
}

async function doSignUp(e){
  e.preventDefault();
  const email = ($('signup-email').value||'').trim();
  const password = $('signup-password').value||'';
  if(!email || !password) return;
  const btn = $('signup-btn');
  if(btn){ btn.disabled = true; btn.textContent = 'Creating...'; }
  const msg = $('magic-msg');
  try{
    const res = await sbReq('/auth/v1/signup', {
      method: 'POST',
      body: JSON.stringify({ email, password })
    });
    // If email confirmation required, res may not contain a session
    if(res?.access_token){
      SB_SESSION = {...res, expires_at: Math.floor(Date.now()/1000) + (res.expires_in||3600)};
      saveSession(SB_SESSION);
      await bootApp();
    } else if(msg){
      msg.textContent = 'Account created — check your email to confirm, then sign in.';
      msg.className = 'auth-info';
    }
  }catch(err){
    if(msg){ msg.textContent = friendlyAuthErr(err); msg.className = 'auth-err'; }
  }finally{
    const btn2 = $('signup-btn');
    if(btn2){ btn2.disabled = false; btn2.textContent = 'Create account'; }
  }
}

async function doMagicLink(e){
  e.preventDefault();
  const email = ($('magic-email').value||'').trim();
  if(!email){ return; }
  const btn = $('magic-btn');
  if(btn){ btn.disabled = true; btn.textContent = 'Sending...'; }
  const msg = $('magic-msg');
  try{
    const payload = { email, options: { emailRedirectTo: location.origin + location.pathname } };
    console.log('[MagicLink] request to:', SUPABASE_URL+'/auth/v1/otp', payload);
    const res = await sbReq('/auth/v1/otp', {
      method: 'POST',
      body: JSON.stringify(payload)
    }, false); // false = use anon key, no session
    console.log('[MagicLink] response:', res);
    if(msg){ msg.textContent = 'Check your inbox — we sent a sign-in link.'; msg.className = 'auth-info'; }
  }catch(err){
    console.error('[MagicLink] full error:', err);
    const detail = String(err?.message||err||'');
    if(msg){ msg.textContent = friendlyAuthErr(err); msg.className = 'auth-err'; }
    console.error('[MagicLink] error message:', detail);
  }
  const btn2 = $('magic-btn');
  if(btn2){ btn2.disabled = false; btn2.textContent = 'Send magic link'; }
}

function friendlyAuthErr(e){
  const m=String(e.message||e);
  if(m.includes('Network')){
    return 'Cannot reach Supabase. Original error: ' + m.replace(/^Network:\s*/, '');
  }
  if(m.includes('rate limit'))return'Too many attempts. Please wait a moment.';
  if(m.includes('Email rate'))return'Too many attempts. Please wait a moment.';
  return m.replace(/^HTTP \d+:\s*/, '');
}


async function doRefreshToken(){
  if(!SB_SESSION?.refresh_token) return false;
  if(!SB_SESSION?.refresh_token) return false;
  try{
    const res = await sbReq('/auth/v1/token?grant_type=refresh_token',{method:'POST',body:JSON.stringify({refresh_token:SB_SESSION.refresh_token})});
    SB_SESSION = {...res, expires_at: Math.floor(Date.now()/1000) + (res.expires_in||3600)};
    saveSession(SB_SESSION); return true;
  }catch(e){ return false; }

// ─── SUGGEST FILL ───
function suggestFill(muscle, exId){
  if(exId){
    if(!S.tmpSel.includes(exId)) S.tmpSel.push(exId);
  } else {
    const exs = getSuggestedExercises().filter(x => x.muscle === muscle);
    if(!exs.length){toast('No suggestion for '+muscle,true);return;}
    exs.forEach(x => { if(!S.tmpSel.includes(x.id)) S.tmpSel.push(x.id); });
  }
  render();
}

function getSuggestedExercises(){
  const today = new Date();
  const suggestions = [];
  const MUSCLE_ORDER = ['Ngực','Lưng','Vai','Tay','Chân','Bụng'];
  const COMPOUND_TYPES = ['Bench Press','Squat','Deadlift','Pull-up','Overhead Press','Barbell Row','Lat Pulldown','Lunges'];

  MUSCLE_ORDER.forEach(muscle => {
    const exs = S.exercises.filter(e => e.muscle === muscle);
    if(!exs.length) return;

    const lastTrained = getLastTrainedDay(muscle);
    const daysSince = lastTrained ? Math.floor((today - lastTrained) / 86400000) : 999;
    const trainedThisWeek = getWeekTrainedCount(muscle);

    if(trainedThisWeek >= 2) return;
    if(daysSince < 2) return;

    let priority = 0;
    priority += Math.min(daysSince / 3, 4);
    if(trainedThisWeek === 0) priority += 3;

    exs.forEach(ex => {
      const isCompound = COMPOUND_TYPES.some(c => ex.name.toLowerCase().includes(c.toLowerCase()));
      const exLastTrained = getLastTrainedDayForEx(ex.id);
      const exDaysSince = exLastTrained ? Math.floor((today - exLastTrained) / 86400000) : 999;
      const isSelected = S.tmpSel.includes(ex.id);
      if(isSelected) return;

      let score = priority;
      if(isCompound) score += 2;
      if(exDaysSince >= 3) score += 1;

      suggestions.push({ muscle, id: ex.id, name: ex.name, type: ex.type, score, daysSince: exDaysSince });
    });
  });

  suggestions.sort((a,b) => b.score - a.score);
  const grouped = {};
  suggestions.forEach(s => {
    if(!grouped[s.muscle]) grouped[s.muscle] = [];
    if(grouped[s.muscle].length < 3) grouped[s.muscle].push(s);
  });

  const result = [];
  Object.values(grouped).forEach(arr => result.push(...arr));
  return result.slice(0, 6);
}

function getLastTrainedDay(muscle){
  const dates = Object.keys(S.logs).sort().reverse();
  for(const k of dates){
    const log = S.logs[k];
    if(!log?.sel) continue;
    for(const id of log.sel){
      const ex = S.exercises.find(e => e.id === id);
      if(ex && ex.muscle === muscle) return new Date(k);
    }
  }
  return null;
}

function getLastTrainedDayForEx(exId){
  const dates = Object.keys(S.logs).sort().reverse();
  for(const k of dates){
    const log = S.logs[k];
    if(log?.sel?.includes(exId)) return new Date(k);
  }
  return null;
}

const SPLITS = {
  ppl: { name: 'Push Pull Legs', icon: '💪', days: 6, desc: 'Ngày Push (Ngực/Vai/Tay sau), Pull (Lưng/Tay trước), Leg (Chân/Bụng)' },
  bro: { name: 'Bro Split', icon: '🔥', days: 5, desc: '1 nhóm cơ/ngày: Ngực, Lưng, Vai, Tay, Chân' },
  full: { name: 'Full Body', icon: '⚡', days: 3, desc: 'Toàn thân mỗi buổi, tốt cho người mới' },
  upper: { name: 'Upper / Lower', icon: '🏋️', days: 4, desc: 'Thân trên (Ngực/Lưng/Vai/Tay) vs Thân dưới (Chân/Bụng)' }
};

function getGreeting(){
  const h = new Date().getHours();
  if(h < 11) return 'Chào buổi sáng';
  if(h < 18) return 'Chào buổi chiều';
  return 'Chào buổi tối';
}

function getRecentDays(){
  const days = [];
  for(let i = 0; i < 7; i++){
    const d = new Date(); d.setDate(d.getDate() - i);
    const k = dk(d);
    const log = S.logs[k];
    if(!log?.sel){ days.push({date:k, label:'Nghỉ', muscles:[]}); continue; }
    const muscles = [...new Set(log.sel.map(id => S.exercises.find(e=>e.id===id)?.muscle).filter(Boolean))];
    days.push({date:k, label: muscles.join(', ') || 'Nghỉ', muscles});
  }
  return days;
}

function pickSplitTarget(){
  const recent = getRecentDays().filter(d => d.muscles.length > 0);
  const last4 = recent.slice(0, 4);
  const lastMuscles = last4.flatMap(d => d.muscles);
  const split = S.aiSplit;
  const counts = {};
  MUSCLE_ORDER.forEach(m => counts[m] = lastMuscles.filter(x => x === m).length);

  if(split === 'ppl'){
    const hasPush = lastMuscles.some(m => ['Ngực','Vai','Tay'].includes(m));
    const hasPull = lastMuscles.some(m => ['Lưng','Tay'].includes(m));
    const hasLeg = lastMuscles.includes('Chân');
    if(!hasPush) return { focus: 'Push (Ngực/Vai/Tay sau)', reason: 'Hôm nay Push day' };
    if(!hasPull) return { focus: 'Pull (Lưng/Tay trước)', reason: 'Hôm nay Pull day' };
    if(!hasLeg) return { focus: 'Leg (Chân/Bụng)', reason: 'Hôm nay Leg day' };
    return { focus: 'Push (Ngực/Vai/Tay sau)', reason: 'Hoàn thành 1 vòng PPL, bắt đầu vòng mới' };
  }

  if(split === 'bro'){
    const rotation = ['Ngực','Lưng','Vai','Tay','Chân'];
    for(const m of rotation){
      if(!counts[m] || counts[m] < 1) return { focus: m, reason: `${m} chưa được tập gần đây` };
    }
    return { focus: 'Bụng', reason: 'Các nhóm chính đã đủ, bổ sung Bụng' };
  }

  if(split === 'full'){
    const trained = lastMuscles.slice(0, 6);
    if(!trained.length) return { focus: 'Toàn thân cân bằng', reason: 'Full body - khởi đầu mới' };
    const weakest = MUSCLE_ORDER.find(m => !counts[m] || counts[m] < 2);
    return { focus: 'Toàn thân (ưu tiên ' + (weakest||'cân bằng') + ')', reason: 'Full body - mỗi buổi tập toàn thân' };
  }

  if(split === 'upper'){
    const hasUpper = lastMuscles.some(m => ['Ngực','Lưng','Vai','Tay'].includes(m));
    if(hasUpper) return { focus: 'Lower (Chân/Bụng)', reason: 'Upper đã đi, hôm nay Lower' };
    return { focus: 'Upper (Ngực/Lưng/Vai/Tay)', reason: 'Lower đã đi, hôm nay Upper' };
  }

  return { focus: 'Toàn thân', reason: 'Chọn split để bắt đầu' };
}

function buildAiPrompt(target){
  const recent = getRecentDays().filter(d => d.muscles.length > 0).slice(0, 5);
  const exNames = S.exercises.map(e => `${e.name}|${e.muscle}|${e.type}`).join('\n');
  return `Bạn là HLV gym. Phân tích lịch tập và gợi ý buổi tập hôm nay.

Split người dùng: ${SPLITS[S.aiSplit].name}
Trọng tâm hôm nay: ${target.focus}
Lý do: ${target.reason}

Lịch tập 5 ngày gần nhất:
${recent.map(d => `- ${d.date}: ${d.label}`).join('\n') || '- Chưa có dữ liệu'}

Danh sách bài tập có sẵn (name|muscle|type):
${exNames}

Yêu cầu:
1. Chọn tối đa 7 bài phù hợp với "${target.focus}"

CHỈ trả JSON, không giải thích thêm.`;
}

async function generatePlan(){
  if(S.aiGenerating) return;

function fallbackPlan(){
  const target = pickSplitTarget();
  const focusMuscles = target.focus.includes('/') ? target.focus.split('/').map(s=>s.trim()) : [target.focus];
  const all = focusMuscles.flatMap(m => {
    if(m === 'Tay sau') return S.exercises.filter(e => e.muscle === 'Tay');
    return S.exercises.filter(e => e.muscle === m);
  });
  return all.slice(0, 6).map(e => ({name: e.name, id: e.id, muscle: e.muscle, reason: 'Gợi ý mặc định'}));
}

async function sbGet(key){
  const r=await sbReq(`/rest/v1/app_data?key=eq.${encodeURIComponent(key)}&select=value`,{method:'GET'},true);
  return r&&r.length?r[0].value:null;

let _saving=false, _dirty=false;
async function save(){
  if(_saving){_dirty=true;return;}
  _saving=true;
  try{
    await Promise.all([sbSet('exercises',S.exercises),sbSet('logs',S.logs),sbSet('nextId',S.nextId)]);
    saveLocal();
    toast('Saved ✓','ok');
  }catch(e){
    if(e.message.includes('401')||e.message.includes('JWT')){
      const ok=await doRefreshToken();
      if(ok)save(); else signOut();
    } else { toast(fErr(e),true); }
  }
  finally{ _saving=false; if(_dirty){_dirty=false;save();} }
}

async function dbLoad(){
  loadLocal();
  const[ex,lg,nid]=await Promise.all([sbGet('exercises'),sbGet('logs'),sbGet('nextId')]);
  S.exercises=ex!==null?ex:JSON.parse(JSON.stringify(DEFAULT));
  S.logs=lg!==null?lg:{};
  S.nextId=nid!==null?nid:19;
  if(ex===null)await save();
}

const DAYS=['Chủ nhật','Thứ 2','Thứ 3','Thứ 4','Thứ 5','Thứ 6','Thứ 7'];
const MONTHS=['Tháng 1','Tháng 2','Tháng 3','Tháng 4','Tháng 5','Tháng 6','Tháng 7','Tháng 8','Tháng 9','Tháng 10','Tháng 11','Tháng 12'];
function dk(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function tdKey(){return dk(new Date());}
function getLog(k){if(!S.logs[k])S.logs[k]={sel:null,ck:{}};return S.logs[k];}
const MUSCLE_ORDER=['Ngực','Lưng','Vai','Tay','Chân','Bụng'];
function getWeekCoverage(){
  const out={};MUSCLE_ORDER.forEach(m=>out[m]=0);
  const today=new Date();const keys=[];
  for(let i=0;i<7;i++){const d=new Date(today);d.setDate(today.getDate()-i);keys.push(dk(d));}
  keys.forEach(k=>{const log=S.logs[k];if(!log?.sel)return;log.sel.forEach(id=>{const ex=S.exercises.find(e=>e.id===id);if(!ex)return;const ck=log.ck[id]||{};const done=ex.sets.filter((_,i)=>ck[i]).length;out[ex.muscle]=(out[ex.muscle]||0)+done;});});
  return out;
}

function render(){
  updateTopbar();
  if(S.tab==='library')renderLib();
  else if(S.tab==='today')renderToday();
  else if(S.tab==='week')renderWeek();
  else if(S.tab==='month')renderMonth();
}

function updateTopbar(){
  const d=new Date(), log=getLog(tdKey());
  let sub=DAYS[d.getDay()]+', '+d.getDate()+'/'+(d.getMonth()+1)+'/'+d.getFullYear();
  let pct=0;
  if(log.sel&&log.sel.length){
    const done=log.sel.filter(id=>{const ex=S.exercises.find(e=>e.id===id);if(!ex)return false;const ck=log.ck[id]||{};return ex.sets.every((_,i)=>ck[i]);}).length;
    pct=Math.round(done/log.sel.length*100);
    sub=done+'/'+log.sel.length+' exercises today';
  }
  $('tb-sub').textContent=sub;
  const circ=94.2, offset=circ-(pct/100)*circ;
  $('top-ring').style.strokeDashoffset=offset;
  $('top-pct').textContent=pct>0?pct+'%':'–';
}

}

function tickSet(exId,si){
  const log=getLog(tdKey());if(!log.ck[exId])log.ck[exId]={};
  const nowDone=!log.ck[exId][si]; log.ck[exId][si]=nowDone;
  const row=$('row-'+exId+'-'+si);
  if(row){
    const box=row.querySelector('.ck-box');
    box.classList.toggle('done',nowDone);
    gsap.fromTo(box,{scale:nowDone?.65:.85},{scale:1,duration:.32,ease:spring});
    const lbl=row.querySelector('.ck-lbl');if(lbl)lbl.classList.toggle('done',nowDone);
    if(nowDone){
      const rpl=document.createElement('div');rpl.className='set-ripple';
      const sz=row.offsetWidth*1.8;rpl.style.cssText=`width:${sz}px;height:${sz}px;left:${-sz/2+22}px;top:${-sz/2+14}px;`;
      row.appendChild(rpl);
      gsap.fromTo(rpl,{scale:0,opacity:1},{scale:1,opacity:0,duration:.55,ease:'power2.out',onComplete:()=>rpl.remove()});
    }
  }
  const selEx=log.sel.map(id=>S.exercises.find(e=>e.id===id)).filter(Boolean);
  const done=selEx.filter(ex=>{const ck=log.ck[ex.id]||{};return ex.sets.every((_,i)=>ck[i]);}).length;
  const pct=selEx.length?Math.round(done/selEx.length*100):0;
  const fin=done===selEx.length&&selEx.length>0;
  const circ=326.7, offset=circ-(pct/100)*circ;
  const arcEl=$('arc-fill');
  if(arcEl){gsap.to(arcEl,{strokeDashoffset:offset,duration:.65,ease:'power2.out'});arcEl.classList.toggle('done',fin);}
  const pctEl=$('arc-pct');
  if(pctEl){const from={v:_lastPct};gsap.to(from,{v:pct,duration:.5,onUpdate:()=>pctEl.textContent=Math.round(from.v)+'%'});}
  const dSets=selEx.reduce((a,ex)=>{const ck=log.ck[ex.id]||{};return a+ex.sets.filter((_,i)=>ck[i]).length;},0);
  const tSets=selEx.reduce((a,ex)=>a+ex.sets.length,0);
  const vals=[String(done),String(selEx.length-done),dSets+'/'+tSets];
  document.querySelectorAll('.ss-val').forEach((el,i)=>{
    if(el.textContent!==vals[i]){gsap.fromTo(el,{y:-5,opacity:0},{y:0,opacity:1,duration:.22,ease:'power2.out'});}
    el.textContent=vals[i];if(i===0)el.style.color=fin?'var(--green)':'var(--t1)';
  });
  if(fin&&_lastPct<100)launchConfetti();
  _lastPct=pct;
  updateTopbar();save();
}

// ─── CONFETTI ───
function launchConfetti(){
  const cv=$('confetti-cv');const ctx=cv.getContext('2d');
  cv.width=window.innerWidth;cv.height=window.innerHeight;
  gsap.to(cv,{opacity:1,duration:.1});
  const P=Array.from({length:70},()=>({
    x:Math.random()*cv.width,y:cv.height*-.15-Math.random()*cv.height*.25,
    vx:(Math.random()-.5)*5,vy:Math.random()*5+3,
    sz:Math.random()*7+3,
    c:['#ffffff','#22d3a0','#60a5fa','#e0e0e0','#888888'][Math.floor(Math.random()*5)],
    rot:Math.random()*360,vr:(Math.random()-.5)*9,life:1
  }));
  function draw(){
    ctx.clearRect(0,0,cv.width,cv.height);let any=false;
    P.forEach(p=>{
      p.x+=p.vx;p.y+=p.vy;p.vy+=.14;p.rot+=p.vr;p.life-=.011;
      if(p.life<=0||p.y>cv.height+20)return;any=true;
      ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.rot*Math.PI/180);
      ctx.globalAlpha=Math.max(0,p.life);ctx.fillStyle=p.c;
      ctx.fillRect(-p.sz/2,-p.sz/2,p.sz,p.sz*.55);ctx.restore();
    });
    if(any)requestAnimationFrame(draw);
    else gsap.to(cv,{opacity:0,duration:.4,onComplete:()=>ctx.clearRect(0,0,cv.width,cv.height)});
  }
  draw();
}

// ─── TIMER ───
let TMR={on:false,paused:false,rem:0,total:0,iv:null};
const fmtT=s=>String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');
function beep(){
  try{const ctx=new(window.AudioContext||window.webkitAudioContext)();[0,160,320].forEach(d=>{const o=ctx.createOscillator(),g=ctx.createGain();o.connect(g);g.connect(ctx.destination);o.frequency.value=600;g.gain.setValueAtTime(.25,ctx.currentTime+d/1000);g.gain.exponentialRampToValueAtTime(.001,ctx.currentTime+d/1000+.2);o.start(ctx.currentTime+d/1000);o.stop(ctx.currentTime+d/1000+.28);});}catch(e){}
  try{navigator.vibrate&&navigator.vibrate([120,60,120,60,300]);}catch(e){}
}
function drawTimer(){
  const r=TMR.rem,num=$('t-num'),ring=$('t-ring');
  num.textContent=fmtT(Math.max(0,r));
  num.className='t-num'+(r<=0?' done':r<=5?' warn':'');
  ring.style.strokeDashoffset=String(471.2-(TMR.total>0?Math.max(0,r/TMR.total)*471.2:0));
  $('t-pause-btn').textContent=TMR.paused?'Resume':'Pause';
}
function startTimer(exId){
  const ex=S.exercises.find(e=>e.id===exId);
  clearInterval(TMR.iv);
  TMR={on:true,paused:false,rem:ex?.rest||90,total:ex?.rest||90,iv:null};
  $('t-ex-name').textContent='Rest · '+(ex?.name||'');
  const ov=$('timer-ov');
  gsap.set(ov,{display:'flex',scale:.9,opacity:0});
  gsap.to(ov,{scale:1,opacity:1,duration:.28,ease:spring});
  drawTimer();
  TMR.iv=setInterval(()=>{if(TMR.paused)return;TMR.rem--;drawTimer();if(TMR.rem<=0){clearInterval(TMR.iv);TMR.on=false;beep();}},1000);
}
function timerToggle(){if(!TMR.on&&TMR.rem<=0){timerClose();return;}TMR.paused=!TMR.paused;drawTimer();}
function timerDone(){clearInterval(TMR.iv);timerClose();}
function timerClose(){gsap.to($('timer-ov'),{scale:.9,opacity:0,duration:.2,ease:'power2.in',onComplete:()=>{$('timer-ov').style.display='none';gsap.set($('timer-ov'),{scale:1,opacity:1});}});clearInterval(TMR.iv);}

// ─── WEEK ───
function wkDates(off){const n=new Date(),m=new Date(n);m.setDate(n.getDate()-n.getDay()+1+off*7);return Array.from({length:7},(_,i)=>{const d=new Date(m);d.setDate(m.getDate()+i);return d;});}
function renderWeek(){
  const days=wkDates(S.wOff),td=tdKey();
  let h=`<div class="cal-nav"><div class="cal-ttl">${days[0].getDate()}/${days[0].getMonth()+1} – ${days[6].getDate()}/${days[6].getMonth()+1}</div>
    <div class="cal-arrows"><button class="cal-arr" onclick="S.wOff--;renderWeek()">${ic.arrL}</button><button class="cal-arr" onclick="S.wOff++;renderWeek()">${ic.arrR}</button></div></div>
  <div class="week-grid">`;
  ['M','T','W','T','F','S','S'].forEach((l,i)=>{
    const d=days[i],k=dk(d),log=S.logs[k],isTd=k===td,isSel=k===S.selDay;
    const sel=log?.sel||[];
    const dn=sel.filter(id=>{const ex=S.exercises.find(e=>e.id===id);if(!ex)return false;const ck=log.ck[id]||{};return ex.sets.every((_,j)=>ck[j]);}).length;
    const dots=sel.length?`<div class="w-dots">${Array.from({length:Math.min(sel.length,5)},(_,j)=>`<div class="w-dot" style="background:${j<dn?'var(--green)':'var(--s4)'}"></div>`).join('')}</div>`:'';
    h+=`<div class="w-col"><div class="w-lbl">${l}</div><div class="w-day${isTd?' today':''}${isSel?' sel':''}" onclick="S.selDay='${k}';renderWeek()"><span class="dn">${d.getDate()}</span>${dots}</div></div>`;
  });
  h+=`</div>`;
  const sk=S.selDay||td,sl=S.logs[sk],sd=new Date(sk+'T00:00:00');
  h+=`<div class="detail-box"><div class="detail-ttl">${DAYS[sd.getDay()]}, ${sd.getDate()}/${sd.getMonth()+1}</div>`;
  const ids=sl?.sel||[];
  if(!ids.length)h+=`<div style="color:var(--t3);font-size:13px;padding:12px 0;text-align:center">No workout logged</div>`;
  else h+=ids.map(id=>{const ex=S.exercises.find(e=>e.id===id);if(!ex)return'';const ck=sl.ck[id]||{},dn2=ex.sets.filter((_,i)=>ck[i]).length;return`<div class="detail-item"><span style="font-size:14px">${ex.type==='gym'?'🏋️':'🤸'}</span><span class="d-name">${ex.name}</span><span class="d-sets">${dn2}/${ex.sets.length}</span>${dn2===ex.sets.length?`<span style="color:var(--green);font-weight:700;font-size:12px">✓</span>`:''}</div>`;}).filter(Boolean).join('');
  h+=`</div>`;
  $('screen-week').innerHTML=h;
  gsap.fromTo('.w-day',{scale:.88,opacity:0},{scale:1,opacity:1,duration:.26,stagger:.03,ease:'power2.out'});
}

// ─── MONTH ───
function renderMonth(){
  const n=new Date(),t=new Date(n.getFullYear(),n.getMonth()+S.mOff,1);
  const yr=t.getFullYear(),mo=t.getMonth(),last=new Date(yr,mo+1,0);
  let wdays=0,tsets=0;
  for(let d=1;d<=last.getDate();d++){const k=dk(new Date(yr,mo,d)),log=S.logs[k];if((log?.sel||[]).length)wdays++;if(log)Object.values(log.ck||{}).forEach(ck=>tsets+=Object.values(ck).filter(v=>v).length);}
  let h=`<div class="cal-nav"><div class="cal-ttl">${MONTHS[mo]} ${yr}</div>
    <div class="cal-arrows"><button class="cal-arr" onclick="S.mOff--;renderMonth()">${ic.arrL}</button><button class="cal-arr" onclick="S.mOff++;renderMonth()">${ic.arrR}</button></div></div>
  <div class="stat-row">
    <div class="stat-box"><div class="stat-val" style="color:var(--green)">${wdays}</div><div class="stat-lbl">Trained</div></div>
    <div class="stat-box"><div class="stat-val">${last.getDate()-wdays}</div><div class="stat-lbl">Rest</div></div>
    <div class="stat-box"><div class="stat-val" style="color:var(--blue)">${tsets}</div><div class="stat-lbl">Sets</div></div>
  </div>
  <div class="m-labels">${['Su','Mo','Tu','We','Th','Fr','Sa'].map(d=>`<div class="m-lbl">${d}</div>`).join('')}</div>
  <div class="m-grid">`;
  const fdow=(new Date(yr,mo,1).getDay()+6)%7;
  let cells=Array(fdow).fill(null);
  for(let d=1;d<=last.getDate();d++)cells.push(new Date(yr,mo,d));
  while(cells.length%7)cells.push(null);
  const td=tdKey();
  cells.forEach(d=>{
    if(!d){h+=`<div class="mcell empty"></div>`;return;}
    const k=dk(d),log=S.logs[k],isTd=k===td;
    const sel=log?.sel||[];
    const dn=sel.filter(id=>{const ex=S.exercises.find(e=>e.id===id);if(!ex)return false;const ck=log.ck[id]||{};return ex.sets.every((_,i)=>ck[i]);}).length;
    const cls=sel.length?(dn===sel.length?'full':'partial'):'rest';
    h+=`<div class="mcell ${cls}${isTd?' today':''}" onclick="showMDay('${k}')">${d.getDate()}</div>`;
  });
  h+=`</div><div id="mday-detail"></div>`;
  $('screen-month').innerHTML=h;
  gsap.fromTo('.mcell:not(.empty)',{scale:.7,opacity:0},{scale:1,opacity:1,duration:.22,stagger:.008,ease:'power2.out'});
}
function showMDay(k){
  const d=new Date(k+'T00:00:00'),log=S.logs[k],sel=log?.sel||[];
  let h=`<div class="detail-box"><div class="detail-ttl">${DAYS[d.getDay()]}, ${d.getDate()}/${d.getMonth()+1}</div>`;
  if(!sel.length)h+=`<div style="color:var(--t3);font-size:13px;padding:12px 0;text-align:center">No workout</div>`;
  else h+=sel.map(id=>{const ex=S.exercises.find(e=>e.id===id);if(!ex)return'';const ck=log.ck[id]||{},dn=ex.sets.filter((_,i)=>ck[i]).length;return`<div class="detail-item"><span>${ex.type==='gym'?'🏋️':'🤸'}</span><span class="d-name">${ex.name}</span><span class="d-sets">${dn}/${ex.sets.length}</span>${dn===ex.sets.length?`<span style="color:var(--green);font-weight:700;font-size:12px">✓</span>`:''}</div>`;}).filter(Boolean).join('');
  h+=`</div>`;
  const el=$('mday-detail');el.innerHTML=h;
  gsap.fromTo(el,{y:8,opacity:0},{y:0,opacity:1,duration:.22,ease:'power2.out'});
}

// ─── TOAST ───
let _tt;
function toast(msg, type){
  const el=$('toast');el.textContent=msg;
  el.className=type==='ok'?'show ok':type===true?'show err':'show';
  clearTimeout(_tt);_tt=setTimeout(()=>el.classList.remove('show'),type?2800:1500);
}

// ─── BOOT ───
init();
</script>
